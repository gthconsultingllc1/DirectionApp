workflows:
  ios-testflight:
    name: Direction iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SolSync App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gthconsulting.direction
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # ITMS-90068: App Store Connect requires iOS 15.0+ from April 2027.
        # scripts/set-ios-deployment-target.js reads this and refuses values below 15.0.
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      node: 20
    scripts:
      - name: Install npm deps
        script: |
          npm ci || npm install
      - name: Add Capacitor iOS + sync
        script: |
          npm install @capacitor/ios@^7.4.3 --save
          npx cap add ios || true
          # Template (and cap sync's pod install) must already be on iOS 15
          # before CocoaPods writes Pods.xcodeproj. Re-apply after sync so a
          # regenerated Podfile, pbxproj, or Info.plist cannot ship 14.0.
          npm run ios:deployment-target
          npx cap sync ios
          npm run ios:deployment-target
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Manual only: no triggering block, so merging does not start this build.
  # Signs with the same upload keystore used for direction-release.aab /
  # direction-release-v3.aab (alias direction-upload). Upload that file in
  # Codemagic as Android keystore reference "direction_upload".
  # Does not publish to Google Play.
  android-closed-testing:
    name: Direction Android closed testing
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - direction_upload
      java: 21
      node: 20
    scripts:
      - name: Install npm deps
        script: npm ci
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Install Android SDK 36
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

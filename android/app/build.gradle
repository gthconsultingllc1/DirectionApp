apply plugin: 'com.android.application'

android {
    namespace "com.gthconsulting.direction"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gthconsulting.direction"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    def firstSet = { names ->
        def found = null
        names.each { name ->
            if (found == null) {
                def env = System.getenv(name)
                if (env != null && env.trim()) {
                    found = env.trim()
                } else {
                    def prop = project.findProperty(name)
                    if (prop != null && prop.toString().trim()) {
                        found = prop.toString().trim()
                    }
                }
            }
        }
        return found
    }
    def keystorePath = firstSet(["CM_KEYSTORE_PATH", "DIRECTION_KEYSTORE_PATH"])
    def keystorePassword = firstSet(["CM_KEYSTORE_PASSWORD", "DIRECTION_KEYSTORE_PASSWORD"])
    def keyAliasValue = firstSet(["CM_KEY_ALIAS", "DIRECTION_KEY_ALIAS"])
    def keyPasswordValue = firstSet(["CM_KEY_PASSWORD", "DIRECTION_KEY_PASSWORD"])

    signingConfigs {
        release {
            // Passwords are never stored in this file. Codemagic android_signing
            // injects CM_KEYSTORE_*. Local release builds use DIRECTION_KEYSTORE_*
            // from the environment or ~/.gradle/gradle.properties.
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { task ->
        task.project == project && (task.name == "bundleRelease" || task.name == "assembleRelease")
    }
    if (releasing && !android.signingConfigs.release.storeFile) {
        throw new GradleException(
            "Release signing is not configured. Set CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, " +
            "CM_KEY_ALIAS, and CM_KEY_PASSWORD (Codemagic android_signing reference direction_upload), " +
            "or DIRECTION_KEYSTORE_PATH, DIRECTION_KEYSTORE_PASSWORD, DIRECTION_KEY_ALIAS, and " +
            "DIRECTION_KEY_PASSWORD as environment variables or Gradle properties. Do not commit passwords."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
